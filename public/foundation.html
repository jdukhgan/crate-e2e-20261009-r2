<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Crate — design foundation</title>
  <link rel="preload" href="/fonts/instrument-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/instrument-serif-latin-400-italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles/tokens.css">
  <link rel="stylesheet" href="/styles/components.css">
  <style>
    /* Harness-only control strip; not part of the product. */
    .fixture-bar { position: fixed; z-index: 50; left: 12px; bottom: 12px; max-width: calc(100% - 24px); padding: 6px 12px; border-radius: 10px; background: var(--ink); color: var(--bg); font-size: 12px; opacity: .92; }
    .fixture-bar summary { cursor: pointer; }
    .fixture-bar label { display: block; margin-top: 6px; }
    .fixture-bar select { font: inherit; }
  </style>
</head>
<body>
  <div id="app" class="app"></div>
  <div id="live" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="/js/foundation.js"></script>
</body>
</html>
